name: Build Normal production

on:
  workflow_dispatch:
    inputs:
      lkm_source_run:
        description: 'Optional completed run from this workflow whose unchanged kernel outputs should be reused'
        required: false
        type: string
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: normal-production-${{ github.ref }}
  cancel-in-progress: false

env:
  MAPLESU_PYTHON: python3
  DDK_RELEASE: '20260828'
  RUSTUP_TOOLCHAIN: '1.99.1'
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  LKM_SOURCE_RUN: ${{ inputs.lkm_source_run || '' }}

defaults:
  run:
    shell: bash

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      kmis: ${{ steps.plan.outputs.kmis }}
      lkm_artifact_ids: ${{ steps.reuse.outputs.lkm_artifact_ids }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Read the pinned source generation and production targets
        id: plan
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'third_party/kernelsu/scripts')
          import ksu_common as C
          manifest = C.read_json(C.MANIFEST_PATH)
          if manifest['upstream']['commit'] != C.UPSTREAM_COMMIT or manifest['source7k']['commit'] != C.SOURCE7K_COMMIT:
              raise SystemExit('manifest source commits differ from the selected build scripts')
          if len(C.KMI_MATRIX) != 8 or len(C.COMPATIBILITY_KMI_MATRIX) != 6:
              raise SystemExit('expected eight Normal targets and six existing companions')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('kmis=' + json.dumps(C.KMI_MATRIX) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'SOURCE7K_REPO={C.SOURCE7K_REPO}\nSOURCE7K_COMMIT={C.SOURCE7K_COMMIT}\n')
          PY
      - name: Rebuild applied source and run the complete source gate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/normal-source"
          # gen_manifest --check independently exports this pinned patch-source tree.
          git init .research/7kimisu
          git -C .research/7kimisu fetch --depth=1 "$SOURCE7K_REPO" "$SOURCE7K_COMMIT"
          python3 third_party/kernelsu/scripts/apply_patches.py --clean 2>&1 | tee "$RUNNER_TEMP/normal-source/apply.log"
          bash third_party/kernelsu/scripts/rebuild.sh --verify-only --source-only 2>&1 | tee "$RUNNER_TEMP/normal-source/source-gate.log"
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'third_party/kernelsu/scripts')
          import ksu_common as C
          manifest = C.read_json(C.MANIFEST_PATH)
          provenance = {
              'schema': 'maplesu-normal-production-source/1',
              'checkoutCommit': os.environ['GITHUB_SHA'],
              'runId': os.environ['GITHUB_RUN_ID'],
              'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'manifestSha256': C.sha256_file(C.MANIFEST_PATH),
              'upstreamCommit': manifest['upstream']['commit'],
              'source7kCommit': manifest['source7k']['commit'],
              'patchSeriesSha256': manifest['patchSeries']['seriesSha256'],
              'aggregatePatchSha256': manifest['patchSeries']['aggregateSha256'],
              'appliedTreeSha256': manifest['applied']['treeSha256'],
              'normalKmis': C.KMI_MATRIX,
              'companionKmis': C.COMPATIBILITY_KMI_MATRIX,
              'ddkRelease': os.environ['DDK_RELEASE'],
              'identity': manifest['identity'],
          }
          Path(os.environ['RUNNER_TEMP'], 'normal-source/source-provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
          PY
          tar -czf "$RUNNER_TEMP/normal-source/applied.tar.gz" third_party/kernelsu/applied
      - name: Validate the requested original LKM run
        id: reuse
        if: inputs.lkm_source_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, urllib.request
          from pathlib import Path
          sys.path.insert(0, 'third_party/kernelsu/scripts')
          import ksu_common as C
          run_id = os.environ['LKM_SOURCE_RUN']
          if not run_id.isdecimal() or run_id == os.environ['GITHUB_RUN_ID']:
              raise SystemExit('lkm_source_run must identify an earlier run')
          base = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY']
          def get(path):
              request = urllib.request.Request(base + path, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request) as response:
                  return json.load(response)
          run = get('/actions/runs/' + run_id)
          workflow = get('/actions/workflows/build-normal.yml')
          if (run['repository']['full_name'] != os.environ['GITHUB_REPOSITORY'] or
                  run['workflow_id'] != workflow['id'] or run['status'] != 'completed'):
              raise SystemExit('requested LKM run is not a completed run of this repository/workflow')
          jobs = get('/actions/runs/' + run_id + '/jobs?filter=latest&per_page=100')
          required = {'source'} | {f'lkm ({kmi})' for kmi in C.KMI_MATRIX}
          succeeded = {job['name'] for job in jobs['jobs']
                       if job['status'] == 'completed' and job['conclusion'] == 'success'}
          if jobs['total_count'] > 100 or not required <= succeeded:
              raise SystemExit('original source and all eight LKM jobs must have succeeded')
          artifacts = get('/actions/runs/' + run_id + '/artifacts?per_page=100')
          names = {'normal-source'} | {f'normal-lkm-{kmi}' for kmi in C.KMI_MATRIX}
          selected = [row for row in artifacts['artifacts'] if row['name'] in names and not row['expired']]
          if artifacts['total_count'] > 100 or len(selected) != len(names) or {row['name'] for row in selected} != names:
              raise SystemExit('original source and eight unique LKM artifacts are required')
          record = {'originalLkmRun': run_id, 'checkoutCommit': run['head_sha'],
                    'workflowId': run['workflow_id'], 'runAttempt': run['run_attempt'],
                    'artifacts': [{'id': row['id'], 'name': row['name']} for row in selected]}
          Path(os.environ['RUNNER_TEMP'], 'normal-source/lkm-source-run.json').write_text(json.dumps(record, indent=2) + '\n')
          ids = ','.join(str(row['id']) for row in selected if row['name'] != 'normal-source')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('lkm_artifact_ids=' + ids + '\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: normal-source
          path: ${{ runner.temp }}/normal-source/
          if-no-files-found: error
          retention-days: 14

  lkm:
    needs: source
    if: github.event_name == 'workflow_dispatch' && inputs.lkm_source_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        kmi: ${{ fromJSON(needs.source.outputs.kmis) }}
    env:
      KMI: ${{ matrix.kmi }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: normal-source
          path: ${{ runner.temp }}/normal-source
      - name: Build the selected Normal LKM and its existing companion
        run: |
          set -euo pipefail
          rm -rf third_party/kernelsu/applied third_party/kernelsu/lkm
          tar -xzf "$RUNNER_TEMP/normal-source/applied.tar.gz"
          mkdir -p third_party/kernelsu/lkm
          DDK_IMAGE="ghcr.io/ylarod/ddk-min:${KMI}-${DDK_RELEASE}"
          docker pull "$DDK_IMAGE"
          bash third_party/kernelsu/scripts/build_lkm.sh --kmi "$KMI" --ddk-image "$DDK_IMAGE" 2>&1 | tee "third_party/kernelsu/lkm/${KMI}_kernelsu.log"
          if python3 -c 'import os,sys; sys.path.insert(0,"third_party/kernelsu/scripts"); import ksu_common as C; sys.exit(0 if os.environ["KMI"] in C.COMPATIBILITY_KMI_MATRIX else 1)'; then
            bash third_party/kernelsu/scripts/build_lkm.sh --kmi "$KMI" --ddk-image "$DDK_IMAGE" --vr-only 2>&1 | tee "third_party/kernelsu/lkm/${KMI}_maplesu_vr.log"
          fi
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'third_party/kernelsu/scripts')
          import ksu_common as C
          source = json.loads(Path(os.environ['RUNNER_TEMP'], 'normal-source/source-provenance.json').read_text())
          if source['checkoutCommit'] != os.environ['GITHUB_SHA'] or source['manifestSha256'] != C.sha256_file(C.MANIFEST_PATH):
              raise SystemExit('source artifact belongs to a different checkout or manifest')
          if C.tree_sha256(C.APPLIED_DIR) != source['appliedTreeSha256']:
              raise SystemExit('applied source changed during the LKM build')
          kmi = os.environ['KMI']
          image = json.loads(subprocess.check_output(['docker', 'image', 'inspect', f'ghcr.io/ylarod/ddk-min:{kmi}-{os.environ["DDK_RELEASE"]}']))[0]
          receipt = {'checkoutCommit': source['checkoutCommit'], 'manifestSha256': source['manifestSha256'],
                     'kmi': kmi, 'ddkImageId': image['Id'], 'ddkRepoDigests': image['RepoDigests'],
                     'artifacts': [{'name': p.name, 'sha256': C.sha256_file(p), 'size': p.stat().st_size}
                                   for p in sorted((C.KSU_ROOT / 'lkm').glob('*.ko'))]}
          (C.KSU_ROOT / f'lkm/{kmi}.source.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: normal-lkm-${{ matrix.kmi }}
          path: third_party/kernelsu/lkm/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: normal-lkm-failure-${{ matrix.kmi }}
          path: third_party/kernelsu/lkm/*.log
          if-no-files-found: warn
          retention-days: 14

  package:
    needs: [source, lkm]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.source.result == 'success' && (needs.lkm.result == 'success' || (inputs.lkm_source_run != '' && needs.lkm.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: normal-source
          path: ${{ runner.temp }}/normal-source
      - name: Prepare fresh production output directories
        run: |
          set -euo pipefail
          rm -rf third_party/kernelsu/applied third_party/kernelsu/lkm third_party/kernelsu/artifacts
          rm -f manager/src/main/jniLibs/arm64-v8a/{libksud_ksu,libmaplesu_ksu,libadbroot}.so
          tar -xzf "$RUNNER_TEMP/normal-source/applied.tar.gz"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.lkm_source_run == ''
        with:
          pattern: normal-lkm-*
          merge-multiple: true
          path: third_party/kernelsu/lkm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.lkm_source_run != ''
        with:
          name: normal-source
          github-token: ${{ github.token }}
          run-id: ${{ inputs.lkm_source_run }}
          path: ${{ runner.temp }}/original-normal-source
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.lkm_source_run != ''
        with:
          artifact-ids: ${{ needs.source.outputs.lkm_artifact_ids }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.lkm_source_run }}
          merge-multiple: true
          path: third_party/kernelsu/lkm
      - name: Prove that reused LKM changes are confined to selected userland inputs
        if: inputs.lkm_source_run != ''
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original-lkm-source"
          tar -xzf "$RUNNER_TEMP/original-normal-source/applied.tar.gz" -C "$RUNNER_TEMP/original-lkm-source"
          python3 - <<'PY'
          import json, os, sys, tomllib
          from pathlib import Path
          sys.path.insert(0, 'third_party/kernelsu/scripts')
          import ksu_common as C
          temp = Path(os.environ['RUNNER_TEMP'])
          current = C.read_json(temp / 'normal-source/source-provenance.json')
          original = C.read_json(temp / 'original-normal-source/source-provenance.json')
          run = C.read_json(temp / 'normal-source/lkm-source-run.json')
          old_tree = temp / 'original-lkm-source/third_party/kernelsu/applied'
          if (str(original['runId']) != run['originalLkmRun'] or original['checkoutCommit'] != run['checkoutCommit'] or
                  str(original['runAttempt']) != str(run['runAttempt']) or C.tree_sha256(old_tree) != original['appliedTreeSha256']):
              raise SystemExit('original source archive does not match its validated run provenance')
          for field in ('upstreamCommit', 'source7kCommit', 'normalKmis', 'companionKmis', 'ddkRelease', 'identity'):
              if original[field] != current[field]:
                  raise SystemExit('LKM source contract changed: ' + field)
          old = {row['path']: row['sha256'] for row in C.tree_file_entries(old_tree, C.TREE_EXCLUDES)}
          new = {row['path']: row['sha256'] for row in C.tree_file_entries(C.APPLIED_DIR, C.TREE_EXCLUDES)}
          changed = sorted(path for path in old.keys() | new.keys() if old.get(path) != new.get(path))
          allowed = {'Cargo.lock', 'userspace/ksud/Cargo.toml', 'userspace/ksud/src/boot_patch.rs'}
          if any(path not in allowed for path in changed):
              raise SystemExit('reused LKM source has changes beyond selected userland inputs: ' + repr(changed))
          manifest_path = 'userspace/ksud/Cargo.toml'
          old_manifest = tomllib.loads((old_tree / manifest_path).read_text())
          new_manifest = tomllib.loads((C.APPLIED_DIR / manifest_path).read_text())
          old_dev = old_manifest.pop('dev-dependencies', {})
          new_dev = new_manifest.pop('dev-dependencies', {})
          if old_manifest != new_manifest or new_dev != old_dev | {'lz4': '1'}:
              raise SystemExit('ksud manifest differs beyond the required lz4 test dependency')
          old_lock = tomllib.loads((old_tree / 'Cargo.lock').read_text())
          new_lock = tomllib.loads((C.APPLIED_DIR / 'Cargo.lock').read_text())
          old_ksud = next(row for row in old_lock['package'] if row['name'] == 'ksud')
          new_ksud = next(row for row in new_lock['package'] if row['name'] == 'ksud')
          old_edges = old_ksud.pop('dependencies')
          new_edges = new_ksud.pop('dependencies')
          if old_lock != new_lock or sorted(new_edges) != sorted(set(old_edges) | {'flate2', 'lz4'}):
              raise SystemExit('Cargo lock differs beyond the two required direct dependency edges')
          old_kernel = C.tree_file_entries(old_tree / 'kernel', C.TREE_EXCLUDES)
          if old_kernel != C.tree_file_entries(C.APPLIED_DIR / 'kernel', C.TREE_EXCLUDES):
              raise SystemExit('kernel source differs from the original LKM build')
          proof = {'originalLkmRun': run['originalLkmRun'], 'originalLkmCheckout': original['checkoutCommit'],
                   'originalLkmManifestSha256': original['manifestSha256'],
                   'originalAppliedTreeSha256': original['appliedTreeSha256'],
                   'packagingCheckout': current['checkoutCommit'], 'packagingManifestSha256': current['manifestSha256'],
                   'packagingAppliedTreeSha256': current['appliedTreeSha256'], 'changedSourcePaths': changed,
                   'originalCargoLockSha256': old['Cargo.lock'], 'packagingCargoLockSha256': new['Cargo.lock'],
                   'kernelTreeSha256': C.tree_sha256(old_tree / 'kernel'), 'kernelFiles': len(old_kernel),
                   'ksudManifestChange': {'dev-dependencies': {'lz4': '1'}},
                   'ksudDirectDependencyEdgesAdded': ['flate2', 'lz4']}
          (temp / 'normal-source/lkm-reuse-proof.json').write_text(json.dumps(proof, indent=2) + '\n')
          PY
      - name: Require all fourteen outputs from this source generation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'third_party/kernelsu/scripts')
          import ksu_common as C
          source = json.loads(Path(os.environ['RUNNER_TEMP'], 'normal-source/source-provenance.json').read_text())
          lkm_source = C.read_json(Path(os.environ['RUNNER_TEMP'], 'original-normal-source/source-provenance.json')) if os.environ['LKM_SOURCE_RUN'] else source
          expected = {C.lkm_entry_name(k) for k in C.KMI_MATRIX} | {f'{k}_maplesu_vr.ko' for k in C.COMPATIBILITY_KMI_MATRIX}
          root = C.KSU_ROOT / 'lkm'
          if source['checkoutCommit'] != os.environ['GITHUB_SHA'] or source['manifestSha256'] != C.sha256_file(C.MANIFEST_PATH):
              raise SystemExit('source generation does not match the packaging checkout')
          if {p.name for p in root.glob('*.ko')} != expected:
              raise SystemExit('the complete eight-Normal/six-companion output set is required')
          received = set()
          for kmi in C.KMI_MATRIX:
              receipt = json.loads((root / f'{kmi}.source.json').read_text())
              if receipt['kmi'] != kmi or receipt['checkoutCommit'] != lkm_source['checkoutCommit'] or receipt['manifestSha256'] != lkm_source['manifestSha256']:
                  raise SystemExit(f'{kmi}: mixed source generation')
              required = {C.lkm_entry_name(kmi)} | ({f'{kmi}_maplesu_vr.ko'} if kmi in C.COMPATIBILITY_KMI_MATRIX else set())
              if len(receipt['artifacts']) != len(required) or {row['name'] for row in receipt['artifacts']} != required:
                  raise SystemExit(f'{kmi}: receipt does not cover exactly its required outputs')
              for row in receipt['artifacts']:
                  p = root / row['name']
                  if p.stat().st_size != row['size'] or C.sha256_file(p) != row['sha256']:
                      raise SystemExit(f'{p}: downloaded artifact differs from the build receipt')
                  received.add(p.name)
          if received != expected:
              raise SystemExit('LKM build receipts do not cover all required outputs')
          PY
      - name: Install the pinned Linux production toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;29.0.14206865' 'cmake;3.22.1'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "CMAKE_BIN=$ANDROID_HOME/cmake/3.22.1/bin/cmake" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmake/3.22.1/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --target aarch64-linux-android
          cargo fetch --locked --manifest-path third_party/kernelsu/applied/Cargo.toml
      - name: Build userland and JNI, then verify the real payload
        env:
          CARGO_NET_OFFLINE: 'true'
        run: |
          set -euo pipefail
          bash third_party/kernelsu/scripts/build_userland.sh --kmi all 2>&1 | tee "$RUNNER_TEMP/normal-source/userland.log"
          bash third_party/kernelsu/scripts/build_jni.sh 2>&1 | tee "$RUNNER_TEMP/normal-source/jni.log"
          for asset in third_party/kernelsu/artifacts/{ksuinit,maplesu_vrinit} third_party/kernelsu/lkm/*.ko; do
            python3 third_party/kernelsu/scripts/verify_embedded_asset.py --asset "$asset" --deep
          done 2>&1 | tee "$RUNNER_TEMP/normal-source/embedded-assets.log"
          BUILT_SOURCE_TREE=$(python3 -c 'import json,os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"normal-source/source-provenance.json")))["appliedTreeSha256"])')
          python3 third_party/kernelsu/scripts/gen_payload.py --built-source-tree "$BUILT_SOURCE_TREE"
          python3 third_party/kernelsu/scripts/verify_payload.py 2>&1 | tee "$RUNNER_TEMP/normal-source/payload-gate.log"
          python3 third_party/kernelsu/scripts/gen_payload.py --check
      - name: Verify target KMI selection in the real ksud build copy
        env:
          CARGO_NET_OFFLINE: 'true'
        run: |
          set -euo pipefail
          cd third_party/kernelsu/.tmp/userland-build
          env -u RUSTFLAGS CARGO_TARGET_DIR="$RUNNER_TEMP/normal-host-tests" \
            cargo test --locked --offline --package ksud \
            boot_patch::block_modules_tests::target_kernel_kmi_selection_uses_the_final_input \
            -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/normal-source/target-kmi-test.log"
          grep -F 'test boot_patch::block_modules_tests::target_kernel_kmi_selection_uses_the_final_input ... ok' \
            "$RUNNER_TEMP/normal-source/target-kmi-test.log"
      - name: Record and export the verified production generation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'third_party/kernelsu/scripts')
          import ksu_common as C
          payload = C.read_json(C.PAYLOAD_PATH)
          names = {C.lkm_entry_name(k) for k in C.KMI_MATRIX} | {f'{k}_maplesu_vr.ko' for k in C.COMPATIBILITY_KMI_MATRIX}
          names.update(('ksuinit', 'maplesu_vrinit', 'libksud_ksu.so', 'libmaplesu_ksu.so', 'libadbroot.so'))
          artifacts = [row for row in payload['artifacts'] if row['name'] in names]
          if {row['name'] for row in artifacts if row['status'] == 'present'} != names:
              raise SystemExit('required production artifacts are not all present')
          source_lock = C.APPLIED_DIR / 'Cargo.lock'
          built_lock = C.KSU_ROOT / '.tmp/userland-build/Cargo.lock'
          if C.sha256_file(source_lock) != C.sha256_file(built_lock):
              raise SystemExit('Cargo changed the selected dependency lock')
          provenance = json.loads(Path(os.environ['RUNNER_TEMP'], 'normal-source/source-provenance.json').read_text())
          if os.environ['LKM_SOURCE_RUN']:
              provenance['lkmReuse'] = C.read_json(Path(os.environ['RUNNER_TEMP'], 'normal-source/lkm-reuse-proof.json'))
          else:
              provenance['originalLkmRun'] = os.environ['GITHUB_RUN_ID']
          provenance.update({'schema': 'maplesu-normal-production/1', 'artifacts': artifacts,
                             'cargoLockSha256': C.sha256_file(built_lock), 'ndk': '29.0.14206865',
                             'rustc': subprocess.check_output(['rustc', '--version'], text=True).strip(),
                             'payloadSha256': C.sha256_file(C.PAYLOAD_PATH)})
          Path(os.environ['RUNNER_TEMP'], 'normal-production.json').write_text(json.dumps(provenance, indent=2) + '\n')
          PY
          tar -czf "$RUNNER_TEMP/normal-production.tar.gz" \
            third_party/kernelsu/{manifest.json,ksu-payload.json,lkm,artifacts} \
            manager/src/main/jniLibs/arm64-v8a/{libksud_ksu,libmaplesu_ksu,libadbroot}.so \
            -C "$RUNNER_TEMP" normal-production.json normal-source
          if [ -n "$LKM_SOURCE_RUN" ]; then
            tar -czf "$RUNNER_TEMP/original-lkm-source-evidence.tar.gz" -C "$RUNNER_TEMP" original-normal-source
          fi
          (cd "$RUNNER_TEMP" && sha256sum normal-production.tar.gz > normal-production.tar.gz.sha256)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: normal-production-${{ github.sha }}
          path: |
            ${{ runner.temp }}/normal-production.json
            ${{ runner.temp }}/normal-production.tar.gz
            ${{ runner.temp }}/normal-production.tar.gz.sha256
            ${{ runner.temp }}/original-lkm-source-evidence.tar.gz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: normal-package-failure
          path: ${{ runner.temp }}/normal-source/*.log
          if-no-files-found: warn
          retention-days: 14
