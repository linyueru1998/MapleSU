name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify extractor dependency files
        run: python jailbreak-providers/ghostlock/build_extractor.py --verify-only
      - name: Verify Normal patch definitions and exported module sources
        run: python -m unittest discover -s tools/tests -p "test_ksu_source.py" -v
      - run: python tools/check_host.py
      - run: python -m pip install -r requirements-native.txt
      - name: Verify native module archive compatibility
        run: python scripts/tests/test-normal-module-archive.py --out "${{ runner.temp }}/module-archive-tests"
      - run: python scripts/sync-ultra-sdk-identity.py --check
      - run: python -m unittest discover -s tools/tests -p "test_sdk_distribution.py" -v
      - run: python tools/check_architecture.py
      - run: python -m unittest discover -s tools/tests -p "test_check_architecture.py" -v
      - run: python -m unittest discover -s tools/tests -p "test_release_audit.py" -v
      - run: python -m unittest discover -s tools/tests -p "test_source_export.py" -v
      - run: python tools/check_source_export.py
      - run: python tools/prepare_native_inputs.py --check
      - run: python -m unittest discover -s tools/tests -p "test_native_inputs.py" -v
      - run: python tools/release_audit.py

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android build inputs
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"'
      - name: Build client SDK and consumer example
        run: bash gradlew :maplesu-client:assembleRelease :maplesu-consumer:assembleDebug --no-build-cache --no-configuration-cache
